sast:
  stage: test

clang-format:
  stage: lint
  image:
    name: kszonek/clang-format-16
    entrypoint: [""]
  script:
    # We need to use simple BusyBox `find` syntax here.
    - >
      clang-format --dry-run --Werror
      $(find src/ -iname '*.cpp' -or -iname '*.hpp' -or -iname '*.c' -or -iname '*.h')
  # script:
  #   - run-clang-format.py -r src --style=file
  # DISABLED because it hides all other job uin CI
  # rules:
  #   - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push")'
  #     changes:
  #       - "src/**/*.{c,h,cpp,hpp}"
  #       - ".clang-format"
  #       - ".clang-format-ignore"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push")
      changes:
        - "src/**/*.{c,h,cpp,hpp}"
        - ".clang-format"
        - ".clang-format-ignore"

build:documentation:
  stage: build
  image: ${PYTHON_DOCKER_IMAGE}
  only:
    refs:
      - master
    changes:
      - "src/*.h"
      - "src/*.cpp"
      - "website/docs/*.md"
      - ".gitlab-ci.yml"
  before_script:
    - apt-get update -qq
    - apt-get install -y doxygen
    - python -m pip install -U pip
    - python -m pip install -U -r requirements/website.txt
  script:
    - export PYTHONPATH=$(pwd)
    - cd website && mkdocs build --verbose
  artifacts:
    name: documentation
    expose_as: "built_documentation"
    paths:
      - website/site
    when: always

# -- DEPLOYMENT JOBS ------------
deploy:pages:
  stage: deploy
  only:
    refs:
      - master
    changes:
      - "src/*.h"
      - "src/*.cpp"
      - "website/docs/*.md"
      - ".gitlab-ci.yml"
  needs:
    - job: build:documentation
      artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
    - mkdir -p public
    - cp -rf website/site/* public/
  artifacts:
    paths:
      - public
